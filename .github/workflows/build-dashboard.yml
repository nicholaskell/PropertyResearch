name: Build development dashboard

on:
  push:
    branches: [main]
    paths:
      - 'properties/**'
      - 'personas/**'
      - 'development-scenario-template.md'
      - 'scripts/**'
      - 'site/**'
      - 'requirements-build.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - run: pip install -r requirements-build.txt
      - run: python scripts/build_data.py
      - name: Commit generated analytical data
        run: |
          git config user.name 'property-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/generated site/site-data.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Rebuild development data and dashboard'
            git push
          fi
